name: Commit Validation

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
  schedule:
    - cron: "0 12 * * *"  # Daily at 5am Seattle time (12 UTC)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_date:
    name: ":clock: Get Date"
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "ymd=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    outputs:
      ymd: ${{ steps.date.outputs.ymd }}

  format:
    name: "Java Formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: google-java-format cache
        uses: actions/cache@v5
        with:
          path: "~/.cache/google-java-format"
          key: google-java-format-${{ hashFiles('tools/fix_java_format.sh') }}
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Java Formatting
        run: tools/fix_java_format.sh --check

  json_template:
    name: "JSON Templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install pytest
      - name: JSON Templates
        run: cd tests && pytest

  checkstyle:
    name: "Checkstyle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkstyle cache
        uses: actions/cache@v5
        with:
          path: "~/.cache/checkstyle"
          key: checkstyle-${{ hashFiles('tools/run_checkstyle.sh') }}
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Checkstyle
        run: tools/run_checkstyle.sh

  build_and_test:
    name: "Bazel Build & Test"
    needs:
      - get_date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bazelisk cache
        uses: actions/cache@v5
        with:
          path: "~/.cache/bazelisk"
          key: ${{runner.os}}-bazelisk-${{ hashFiles('.bazelversion') }}
      - name: Bazel cache
        uses: actions/cache@v5
        with:
          path: "~/.cache/bazel"
          key: ${{runner.os}}-bazel-17-${{ hashFiles('.bazelversion', 'WORKSPACE', 'maven_install.json') }}-test-${{ needs.get_date.outputs.ymd }}
          restore-keys: |
            ${{runner.os}}-bazel-17-${{ hashFiles('.bazelversion', 'WORKSPACE', 'maven_install.json') }}-test-
            ${{runner.os}}-bazel-17-${{ hashFiles('.bazelversion', 'WORKSPACE', 'maven_install.json') }}-
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Bazel build and test
        run: |
          # Stop on first test failure for PRs; keep going for scheduled runs to see all failures
          TEST_KEEP_GOING="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TEST_KEEP_GOING="true"
          fi
          bazel test --test_output=errors --test_keep_going=$TEST_KEEP_GOING -- //...
      - name: Build JAR
        run: |
          mkdir workspace
          bazel build //projects/allinone:allinone_main_deploy.jar
          cp bazel-bin/projects/allinone/allinone_main_deploy.jar workspace/allinone.jar
      - name: Save JAR
        uses: actions/upload-artifact@v6
        with:
          name: allinone_jar_17
          path: workspace/allinone.jar

  validation_summary:
    name: "Validation Summary"
    runs-on: ubuntu-latest
    needs: [format, json_template, checkstyle, build_and_test]
    if: always()
    steps:
      - name: Check validation results
        run: |
          echo "## Commit Validation Results"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Java Formatting | ${{ needs.format.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| JSON Templates | ${{ needs.json_template.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| Checkstyle | ${{ needs.checkstyle.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo "| Bazel Build & Test | ${{ needs.build_and_test.result == 'success' && '✅ Pass' || '❌ Fail' }} |"
          echo ""
          
          # Fail if any check failed
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.json_template.result }}" != "success" ] || \
             [ "${{ needs.checkstyle.result }}" != "success" ] || \
             [ "${{ needs.build_and_test.result }}" != "success" ]; then
            echo "❌ Some validation checks failed"
            exit 1
          fi
          echo "✅ All validation checks passed"
